<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ChoreQuest Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #1a1a2e; color: white; font-family: sans-serif; text-align: center; padding: 2rem; }
        .card { background: #16213e; padding: 2rem; border-radius: 12px; border: 2px solid #e94560; max-width: 400px; margin: 0 auto; }
        button { background: #e94560; color: white; border: none; padding: 1rem; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 1rem; }
        input { width: 100%; padding: 0.8rem; margin-top: 10px; background: #0f3460; border: 1px solid #4a90e2; color: white; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>
    <h1>🛡️ Console d'Urgence</h1>
    <div class="card">
        <p>Forcer une version globale :</p>
        <input type="number" id="build-num" value="75">
        <button onclick="forceUpdate()">🚀 DÉPLOYER LA VERSION</button>
        <p id="status" style="margin-top:20px; opacity:0.7; font-size:0.8rem;"></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="js/config.js"></script>
    <script>
        firebase.initializeApp(CONFIG.firebase);
        const db = firebase.firestore();

        async function forceUpdate() {
            const build = document.getElementById('build-num').value;
            const status = document.getElementById('status');
            status.innerText = "Tentative de connexion...";
            
            try {
                // Try anonymous first, if fails, it will use existing session or fail
                await firebase.auth().signInAnonymously().catch(e => console.warn("Anon auth disabled"));

                status.innerText = "Émission de l'ordre build " + build + "...";
                await db.collection('system').doc('config').set({
                    minBuild: parseInt(build),
                    lastUpdate: new Date().toISOString(),
                    source: 'Emergency Console'
                }, { merge: true });

                status.innerHTML = "✅ ORDRE ENVOYÉ !<br>Tous les appareils connectés vont redémarrer.";
            } catch (e) {
                status.innerText = "❌ ERREUR : " + e.message + "\n(Vérifiez que l'auth ANONYME est activée dans Firebase)";
            }
        }
    </script>
</body>
</html>
