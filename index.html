<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChoreQuest</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/styles.css?v=2">
    <meta name="theme-color" content="#4a90e2">
</head>
<body>
    <div id="app">
        <header>
            <h1>🛡️ ChoreQuest</h1>
            <div id="auth-container">
                <button id="authorize_button" style="display: none;">Connect to Google Drive</button>
                <button id="signout_button" style="display: none;">Sign Out</button>
            </div>
        </header>

        <main>
            <div id="loading" style="display: none;">Loading Quest Log...</div>
            
            <section id="content" style="display: none;">
                <div id="user-profile"></div>
                <div id="quest-board">
                    <h2>Available Quests</h2>
                    <ul id="task-list"></ul>
                    <button id="add-quest-btn" class="action-btn">+ New Quest</button>
                </div>
            </section>
            
            <section id="welcome-screen">
                <p>Welcome, Hero! Connect your Google Drive to start your adventure.</p>
            </section>
        </main>
    </div>

    <script src="js/config.js?v=2"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <script src="js/auth.js?v=2" defer></script>
    <script src="js/drive.js?v=2" defer></script>
    <script src="js/app.js?v=2" defer></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js?v=2')
                    .then(reg => {
                        console.log('SW Registered');
                        // Force update if a new service worker is found
                        reg.onupdatefound = () => {
                            const installingWorker = reg.installing;
                            installingWorker.onstatechange = () => {
                                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    window.location.reload();
                                }
                            };
                        };
                    });
            });
        }
    </script>
</body>
</html>
